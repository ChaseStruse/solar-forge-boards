services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solar_forge_boards
      POSTGRES_USER: solar_forge_boards
      POSTGRES_PASSWORD: solar_forge_boards
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar_forge_boards -d solar_forge_boards"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - solar-forge-boards-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://solar_forge_boards:solar_forge_boards@db:5432/solar_forge_boards
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://solar_forge_boards:solar_forge_boards@db:5432/solar_forge_boards
      FLASK_SECRET_KEY: local-development-secret
      FLASK_DEBUG: "1"
    command: ["flask", "--app", "backend.app.wsgi:app", "run", "--debug", "--host=0.0.0.0", "--port=8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro

volumes:
  solar-forge-boards-data:
