[project]
name = "solar-forge-boards"
version = "0.1.0"
description = "A fast, server-owned Solar Forge project management application built for people and agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5",
    "flask>=3.1.2",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.11.9",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/app", "backend/tests"]
plugins = ["pydantic.mypy"]
exclude = ["backend/migrations"]

[[tool.mypy.overrides]]
module = ["flask.*"]
ignore_missing_imports = true
