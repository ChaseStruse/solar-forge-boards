<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b14">
    <title>{% block title %}Solar Forge Boards{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.8" defer></script>
    <script src="{{ url_for('static', filename='js/board.js') }}" defer></script>
  </head>
  <body hx-on::before-swap="if (event.detail.xhr.status === 422 && event.detail.requestConfig.elt.matches('.story-form, .edit-story-form')) { event.detail.shouldSwap = true; event.detail.isError = false; }">
    <header class="topbar">
      <a class="brand" href="{{ url_for('ui.projects_page') }}"><span class="brand-mark" aria-hidden="true">S</span>Solar Forge Boards</a>
      <span class="tagline">Focused work, clearly shaped.</span>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
  </body>
</html>
